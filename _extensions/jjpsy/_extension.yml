title: 心理学研究 (JJPsy) Quarto Format
author: Yoshihiko Kunisato
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      documentclass: ltjsbook
      classoption: [oneside]
      pdf-engine: lualatex
      cite-method: biblatex
      biblio-style: jpa
      include-in-header:
        - header.tex
      format-resources:
        - jpa.bbx
        - jpa.cbx
        - jpa.dbx
    docx:
      reference-doc: JJPsy_template.docx
